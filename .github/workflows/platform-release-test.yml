name: Platform release tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.0.0', '1.1.0', '1.2.0']
        platform:
          - {runner: windows-2025, os: windows, arch: x64, extension: zip}
          - {runner: windows-11-arm, os: windows, arch: arm64, extension: zip}
          - {runner: ubuntu-24.04, os: linux, arch: x64, extension: tar.gz}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, extension: tar.gz}
          - {runner: macos-15-intel, os: macos, arch: x64, extension: tar.gz}
          - {runner: macos-14, os: macos, arch: arm64, extension: tar.gz}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Download and test release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ matrix.version }}'
          $os = '${{ matrix.platform.os }}'
          $arch = '${{ matrix.platform.arch }}'
          $name = "vektkove-$version-$os-$arch.${{ matrix.platform.extension }}"
          $archive = Join-Path $env:RUNNER_TEMP $name
          $package = Join-Path $env:RUNNER_TEMP 'vektkove-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/v$version/$name" -OutFile $archive
          if ($os -eq 'windows') { Expand-Archive $archive -DestinationPath $package -Force; $command = Join-Path $package 'vk.exe' }
          else { tar -xzf $archive -C $package; if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }; $command = Join-Path $package 'vk' }
          $reported = & $command --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "Vektkove $version") { throw "Incorrect version: $reported" }
          $source = Join-Path $package 'examples/hello.vk'
          $output = & $command run $source
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -ne "Hello from Vektkove`n5") { throw 'Example execution failed' }
          if ($version -ne '1.0.0') {
            $encoded = Join-Path $env:RUNNER_TEMP 'encoded.txt'
            $decoded = Join-Path $env:RUNNER_TEMP 'decoded.vk'
            & $command encode zstd+base64 $source $encoded
            if ($LASTEXITCODE -ne 0) { throw 'Encoding failed' }
            & $command decode base64+zstd $encoded $decoded
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash $source).Hash -ne (Get-FileHash $decoded).Hash) { throw 'Decoding failed' }
          }
          Write-Host "$os $arch $version passed."