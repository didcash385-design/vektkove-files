name: Windows installer build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler is unavailable' }
          $env:VK_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP 'installers'
          New-Item -ItemType Directory -Path $env:VK_OUTPUT_DIR -Force | Out-Null
          foreach ($architecture in @('x64', 'arm64')) {
            $env:VK_ARCH = $architecture
            $env:VK_SOURCE_DIR = Join-Path $env:RUNNER_TEMP "package-$architecture"
            $url = "https://github.com/${{ github.repository }}/releases/download/v1.0.0/vektkove-1.0.0-windows-$architecture.zip"
            $archive = Join-Path $env:RUNNER_TEMP "$architecture.zip"
            Invoke-WebRequest -Uri $url -OutFile $archive
            Expand-Archive $archive -DestinationPath $env:VK_SOURCE_DIR
            Copy-Item portable/WINDOWS.md (Join-Path $env:VK_SOURCE_DIR 'WINDOWS.md') -Force
            & $compiler portable/windows-installer.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed for $architecture" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: ${{ runner.temp }}/installers/*.exe
          if-no-files-found: error
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers
      - name: Install, run, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD 'installers/vektkove-1.0.0-windows-${{ matrix.architecture }}-setup.exe'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs/Vektkove'
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $installDir) { throw 'Installer did not add Vektkove to the user PATH' }
          $env:PATH = "$env:PATH;$userPath"
          $command = Get-Command vk.exe -ErrorAction Stop
          $version = & $command.Source --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'Vektkove 1.0.0') { throw 'Installed version check failed' }
          $output = & $command.Source run (Join-Path $installDir 'examples/hello.vk')
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -ne "Hello from Vektkove`n5") { throw 'Installed program check failed' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          if (Test-Path (Join-Path $installDir 'vk.exe')) { throw 'Uninstaller left vk.exe behind' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $installDir) { throw 'Uninstaller left Vektkove in the user PATH' }
          [Environment]::SetEnvironmentVariable('Path', "$userPath;$installDir", 'User')
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Reinstallation with a preexisting PATH entry failed' }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Second uninstall failed' }
          $preservedPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($preservedPath -split ';') -notcontains $installDir) { throw 'Uninstaller removed a preexisting PATH entry' }
          [Environment]::SetEnvironmentVariable('Path', $userPath, 'User')
          Write-Host 'Installer, terminal command, and uninstaller passed.'